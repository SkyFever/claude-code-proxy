# Install the two `map` and `log_format` declarations inside the `http` block.
# Install `server` inside the same `http` block.  Do NOT expose this listener
# on a public interface; use an IP address owned by the server's LAN NIC.
#
# Replace REPLACE_WITH_64_HEX_SECRET with the output of `openssl rand -hex 32`
# (exactly 64 lowercase hexadecimal characters), and replace the IP/TLS paths.
# Use only that alphabet: the configured secret is part of a regular expression.
# Nginx's map does not provide timing-constant comparisons.

map $http_authorization $ccp_auth_ok {
    default 0;
    # A plain map string ignores case, including the token. Only the Bearer
    # scheme is case-insensitive here. The hex guard also rejects the unchanged
    # placeholder, so the example cannot authenticate until a key is installed.
    "~^(?i:Bearer) (?=[0-9a-f]{64}$)REPLACE_WITH_64_HEX_SECRET$" 1;
}

# Only 401/403 generated locally, including a LAN denial with a valid key.
# An upstream response has an upstream status and is not a local auth failure.
# Do not accidentally log successful client bearer tokens, bodies, or queries.
map "$status:$upstream_status" $ccp_auth_failure {
    default 0;
    "~^(?:401|403):(?:-)?$" 1;
}

log_format ccp_auth_fail '$time_iso8601 '
    'ip=$remote_addr method=$request_method path=$uri '
    'status=$status upstream=$upstream_status request_id=$request_id';

server {
    # Example only: replace with your server's actual LAN address.
    listen 192.168.0.29:18766 ssl;
    server_name _;

    ssl_certificate     /path/to/lan-server.crt;
    ssl_certificate_key /path/to/lan-server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # User's LAN range; adjust to the real subnet. Not a substitute for TLS.
    allow 192.168.0.0/24;
    deny all;

    client_max_body_size 64m;
    access_log logs/ccp-auth-fail.log ccp_auth_fail if=$ccp_auth_failure;

    error_page 401 = @ccp_authentication_error;
    error_page 403 = @ccp_permission_error;

    location /v1/ {
        if ($ccp_auth_ok = 0) { return 401; }

        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Api-Key "";
        proxy_set_header Connection "";
        # Keep the upstream's status, body and request-id unchanged. The named
        # error handlers below apply only to errors generated by this gateway.
        proxy_intercept_errors off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location @ccp_authentication_error {
        types { }
        default_type application/json;
        add_header request-id $request_id always;
        add_header Cache-Control "no-store" always;
        add_header WWW-Authenticate 'Bearer realm="claude-code-proxy"' always;
        return 401 '{"type":"error","error":{"type":"authentication_error","message":"Invalid gateway API key"},"request_id":"$request_id"}';
    }

    location @ccp_permission_error {
        types { }
        default_type application/json;
        add_header request-id $request_id always;
        add_header Cache-Control "no-store" always;
        return 403 '{"type":"error","error":{"type":"permission_error","message":"Client address is not allowed"},"request_id":"$request_id"}';
    }

    # Do not expose /monitor, /healthz or other operational endpoints.
    location / { return 404; }
}
